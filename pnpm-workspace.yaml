packages:
  - "apps/*"
  - "packages/*"

# Dependencies allowed to run install scripts
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  bufferutil: true
  prisma: true
  # sharp ships prebuilt binaries; its script only builds from source, which
  # fails on machines with a system-wide libvips
  sharp: false
  unrs-resolver: true
  utf-8-validate: true

# pnpm only honors overrides at the workspace root
overrides:
  "@types/react": "19.1.4"
  "@types/react-dom": "19.1.5"
